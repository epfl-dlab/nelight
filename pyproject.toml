[project]
name = "nelight"
version = "0.1.0"
description = "Strong Heuristics for Named Entity Linking (Čuljak et al., NAACL SRW 2022)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "EPFL DLAB" }]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
# Recompute heuristics and (optionally) BART embedding caches.
from-scratch = [
    "torch>=1.10",
    "transformers>=4.20",
    "tqdm>=4.60",
    "nltk>=3.6",
    "pywsd>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runlib", "cache_building"]

[tool.uv]
default-groups = []
package = true
